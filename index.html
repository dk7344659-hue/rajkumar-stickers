<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajkumar Stickers</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f1115;
  color:white;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

.hero{
  text-align:center;
  padding:45px 10px;
}

h1{
  font-size:42px;
  margin:8px 0;
}

.sub{
  color:#b9b9c5;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#171a21;
  border:1px solid #303642;
  border-radius:16px;
  padding:15px;
  text-align:center;
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:white;
  border-radius:10px;
}

.card h3{
  margin:12px 0 0;
}

a{
  color:#9b4dff;
}

footer{
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<div class="wrap">

<header class="hero">
<div class="sub">RAJA STICKER LAB</div>

<h1>Raja Stickers</h1>

<p class="sub">
Original Animated GIFs & Stickers
</p>

<p>
<a href="https://www.instagram.com/rajastickerlab/">
Instagram @rajastickerlab
</a>
</p>
</header>

<div class="grid" id="gallery">
</div>

<footer>
© 2026 Raja Stickers
</footer>

</div>

<script>

const owner = "dk7344659-hue";
const repo = "dk7344659-hue.github.io";

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)
.then(response => response.json())
.then(files => {

  const gallery = document.getElementById("gallery");

  files
   .filter(file => file.type === "file" && /\.(gif|jpe?g|png|webp)$/i.test(file.name))
    .forEach(file => {

      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = file.name;

      const title = document.createElement("h3");
      title.textContent = file.name
        .replace(/\.(gif|jpe?g|png|webp)$/i, "")
        .replace(/[_-]+/g," ");

      card.appendChild(img);
      card.appendChild(title);

      gallery.appendChild(card);
    });

});

</script>

</body>
</html>
